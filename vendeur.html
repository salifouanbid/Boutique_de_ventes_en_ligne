<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Espace vendeur — Pochettes Chic</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="vendeur-box">
  <h1>Livraison en cours</h1>
  <p class="track-status">Collez le code de suivi reçu du client, puis appuyez sur Démarrer. Gardez cette page ouverte pendant la livraison.</p>
  <input id="code" class="track-form" style="padding:.8em;font:inherit;text-transform:uppercase" placeholder="PC-7K4M2Q" maxlength="9" autocomplete="off">
  <button id="go" class="btn btn-primary">Démarrer la livraison</button>
  <button id="stop" class="btn btn-secondary" disabled>Livraison terminée</button>
  <p id="msg" class="track-status" role="status" aria-live="polite"></p>
</main>
<script src="config.js"></script>
<script>
let watch = null, last = 0, lock = null, code = '';
const $ = id => document.getElementById(id), say = t => $('msg').textContent = t;
const put = body => fetch(`${TRACKING_DB_URL}/positions/${code}.json`, {method:'PUT', body:JSON.stringify(body)});
$('go').onclick = async () => {
  code = $('code').value.trim().toUpperCase();
  if (!/^PC-[A-Z0-9]{6}$/.test(code)) return say('Code invalide.');
  if (!TRACKING_DB_URL) return say('Renseigne TRACKING_DB_URL dans config.js.');
  if (!navigator.geolocation) return say('Localisation non disponible.');
  try { lock = await navigator.wakeLock.request('screen'); } catch {}
  watch = navigator.geolocation.watchPosition(p => {
    if (Date.now() - last < 3000) return;
    last = Date.now();
    put({lat:p.coords.latitude, lng:p.coords.longitude, t:last})
      .then(() => say('Position partagée avec le client.'))
      .catch(() => say('Envoi impossible, vérifie ta connexion.'));
  }, () => say('Autorise la localisation pour partager ta position.'), {enableHighAccuracy:true, maximumAge:2000});
  $('go').disabled = true; $('stop').disabled = false; say('Démarrage…');
};
$('stop').onclick = async () => {
  navigator.geolocation.clearWatch(watch); lock && lock.release();
  await put({done:true, t:Date.now()}).catch(() => {});
  $('go').disabled = false; $('stop').disabled = true; say('Livraison terminée.');
};
</script>
</body>
</html>
